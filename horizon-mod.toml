id = "camera_utils"
name = "Camera Utils"
version = "0.1.0"
description = "Camera utilities mod (Freecam, Freelock, Zoom) for Horizon"
authors = ["GkungZ01"]
license = "MIT"
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "turn"
target = "horizon_client::game::perspective::Game<'_>::turn_player"
kind = "HEAD"
cancellable = true
helper = "src/mixins/turn.rs"
bindings = [
  { name = "xo", ty = "f64", value = "xo" },
  { name = "yo", ty = "f64", value = "yo" },
]
