[package]
name = "camera-utils"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Camera utilities mod (Freecam, Freelock, Zoom) for native Horizon"

[lib]
# This exact source is also injected as a same-crate module by horizon-mixins.
path = "mixins/camera_utils/runtime.rs"

[workspace]
members = ["tools/audit"]
resolver = "2"
