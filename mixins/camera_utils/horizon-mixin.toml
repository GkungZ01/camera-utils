[mod]
id = "camera_utils"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "camera_utils"
source = "runtime.rs"

[[injection]]
id = "zoom-hook"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_zoom"
helper = "zoom.rs"
bindings = [{ name = "zoom", ty = "&mut Option<crate::game::native_hooks::NativeZoom>", value = "zoom" }]

[[injection]]
id = "key-hook"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
    { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
    { name = "key", ty = "&str", value = "key" },
    { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "turn-hook"
kind = "HEAD"
target = "horizon_client::game::perspective::Game<'_>::turn_player"
helper = "turn.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "xo", ty = "f64", value = "xo" },
    { name = "yo", ty = "f64", value = "yo" },
]
